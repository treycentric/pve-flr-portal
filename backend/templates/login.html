<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in &mdash; File Level Restore Portal for Proxmox Backup Server</title>
  <link rel="icon" type="image/png" href="/static/assets/logo.png?v={{ static_version('assets/logo.png') }}">
  {# Theme (issue #29): match base.html - resolve before first paint. #}
  <script>
    (function () {
      var d = "{{ default_theme }}";
      window.__PFR_DEFAULT_THEME__ = d;
      try {
        var t = localStorage.getItem('pfr_theme');
        if (['light', 'dark', 'proxmox-dark', 'auto'].indexOf(t) === -1) t = d;
        var resolved = t;
        if (t === 'auto') {
          resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version('style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <img class="topbar-icon" src="/static/assets/logo.png?v={{ static_version('assets/logo.png') }}" alt="">
      <h1>File Level Restore Portal <span class="app-name-suffix">for Proxmox Backup Server</span></h1>
    </div>
  </header>
  <div class="login-wrap">
    <form
      class="login-box"
      method="post"
      action="/login"
      x-data="{
        save: false,
        selectedType: 'pam',
        updateType() { this.selectedType = $refs.realm.selectedOptions[0]?.dataset.type || ''; },
        handleSubmit(event) {
          // Issue #56: an OpenID Connect realm has no password to POST -
          // send the browser into the SSO redirect flow instead of
          // submitting this form. A plain function-call expression here
          // (rather than an inline if/else statement block in @submit
          // itself) - Alpine's expression compiler for x-on rejects a
          // leading `if` as a syntax error (confirmed live: it throws
          // and never attaches the listener at all, so the form silently
          // falls through to its default POST - PVE then 422s on the
          // missing password field).
          if (this.selectedType === 'openid') {
            event.preventDefault();
            window.location.href = '/login/oidc/' + encodeURIComponent(this.$refs.realm.value);
            return;
          }
          if (this.save) {
            localStorage.setItem('pfr_login', JSON.stringify({ username: this.$refs.username.value, realm: this.$refs.realm.value }));
          } else {
            localStorage.removeItem('pfr_login');
          }
        },
      }"
      x-init="$nextTick(() => {
        const saved = JSON.parse(localStorage.getItem('pfr_login') || 'null');
        if (saved) {
          $refs.username.value = saved.username || '';
          // Only restore the realm if it still matches a listed option -
          // assigning an unknown value leaves the <select> with nothing
          // selected, and the browser then omits it from the POST.
          const hasRealm = [...$refs.realm.options].some((o) => o.value === saved.realm);
          if (hasRealm) $refs.realm.value = saved.realm;
          save = true;
        }
        updateType();
      })"
      @submit="handleSubmit($event)">
      <img class="about-logo login-logo" src="/static/assets/logo.png?v={{ static_version('assets/logo.png') }}" alt="">
      <h2 class="login-title">Log in</h2>
      {% if notice %}
      <p class="login-notice">{{ notice }}</p>
      {% endif %}
      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}
      <div class="login-password-fields" x-show="selectedType !== 'openid'">
        <label class="login-label" for="username">Username</label>
        <input class="login-input" type="text" id="username" name="username" x-ref="username" placeholder="username" autocomplete="username" x-bind:required="selectedType !== 'openid'" autofocus>
        <label class="login-label" for="password">Password</label>
        <input class="login-input" type="password" id="password" name="password" autocomplete="current-password" x-bind:required="selectedType !== 'openid'">
      </div>
      <label class="login-label" for="realm">Realm</label>
      <select class="login-input" id="realm" name="realm" x-ref="realm" @change="updateType()">
        {% for r in realms %}
        <option value="{{ r.realm }}" data-type="{{ r.type }}" {% if r.realm == 'pam' %}selected{% endif %}>{{ r.comment or r.realm }}</option>
        {% endfor %}
      </select>
      <label class="login-checkbox-row" x-show="selectedType !== 'openid'">
        <input type="checkbox" x-model="save">
        Save username
      </label>
      <button type="submit" class="btn-primary login-submit" x-text="selectedType === 'openid' ? 'Continue with SSO' : 'Log in'">Log in</button>
    </form>
  </div>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
</html>
