<ul class="tree-list">
  {% for node in nodes %}
  <li class="tree-item" x-data="{ open: false }">
    <div class="tree-node">
      <button
        type="button"
        class="tree-toggle"
        data-filepath="{{ node.filepath }}"
        :class="{ 'is-open': open }"
        @click="open = !open; trackTreeToggle('{{ node.filepath }}', open)"
        hx-get="/api/tree?volume={{ volume | urlencode }}&filepath={{ node.filepath | urlencode }}&crumbs={{ node.crumbs_json | urlencode }}"
        hx-target="next ul"
        hx-swap="innerHTML"
        hx-trigger="click once">&#9656;</button>
      <button
        type="button"
        class="tree-label"
        data-crumbs='{{ node.crumbs_json }}'
        :class="{ 'is-selected': volume === '{{ volume }}' && crumbs.length && crumbs[crumbs.length - 1].filepath === '{{ node.filepath }}' }"
        :disabled="loading"
        @click="setPath(JSON.parse($el.dataset.crumbs))">
        {% if node.type_label == 'Drive' %}
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>
        {% else %}&#128193;{% endif %}
        {{ node.text }}
      </button>
    </div>
    <ul class="tree-list tree-children" x-show="open" x-cloak></ul>
  </li>
  {% endfor %}
</ul>
