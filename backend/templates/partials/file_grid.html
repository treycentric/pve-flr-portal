<form class="file-grid-form" x-ref="form" data-volume="{{ volume }}" x-data="fileGridState()" @change="syncAllChecked()">
  <div class="grid-toolbar">
    <button type="button" class="btn-outline" disabled title="Restore to guest &mdash; planned (PH.5)">Restore</button>

    <button type="button" class="btn-outline" disabled x-show="count === 0">Download</button>

    <a class="btn-outline" x-show="count > 0 && isSingleFile" :href="singleDownloadHref()">Download</a>

    <div class="dropdown-btn" x-show="count > 0 && !isSingleFile" x-cloak @click.outside="downloadMenuOpen = false">
      <button type="button" class="btn-outline dropdown-btn-main" @click.stop="downloadMenuOpen = !downloadMenuOpen">
        Download as
        <svg class="dropdown-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dropdown-menu" x-show="downloadMenuOpen" x-cloak>
        <a class="dropdown-item" :href="bundleHref('zip')" @click="downloadMenuOpen = false">.zip</a>
        <a class="dropdown-item" :href="bundleHref('targz')" @click="downloadMenuOpen = false">.tar.gz</a>
        <a class="dropdown-item" :href="bundleHref('tarzst')" @click="downloadMenuOpen = false">.tar.zst</a>
      </div>
    </div>
  </div>
  <div class="table-scroll">
    <table class="file-grid">
      <thead>
        <tr>
          <th class="checkbox-col"><input type="checkbox" x-model="allChecked" @change="toggleAll()"></th>
          <th class="sortable" @click="setSort('name')">Name<span class="sort-arrow" x-show="sortKey === 'name'" x-text="sortDir === 'asc' ? '▲' : '▼'"></span></th>
          <th class="sortable" @click="setSort('size')">Size<span class="sort-arrow" x-show="sortKey === 'size'" x-text="sortDir === 'asc' ? '▲' : '▼'"></span></th>
          <th class="sortable" @click="setSort('type')">Type<span class="sort-arrow" x-show="sortKey === 'type'" x-text="sortDir === 'asc' ? '▲' : '▼'"></span></th>
          <th class="sortable" @click="setSort('modified')">Modified<span class="sort-arrow" x-show="sortKey === 'modified'" x-text="sortDir === 'asc' ? '▲' : '▼'"></span></th>
        </tr>
      </thead>
      <tbody x-ref="tbody">
        {% for e in entries %}
        <tr
          data-name="{{ e.text | lower }}"
          data-size="{{ e.size if e.size is not none else -1 }}"
          data-type="{{ e.type_label | lower }}"
          data-modified="{{ e.mtime if e.mtime is not none else 0 }}"
          data-filepath="{{ e.filepath }}"
          x-show="!fileFilter || $el.dataset.name.includes(fileFilter.toLowerCase())">
          <td><input type="checkbox" name="item" value="{{ e.item_json }}"></td>
          <td>
            {% if not e.leaf %}
            <button
              type="button"
              class="link-btn"
              data-filepath="{{ e.filepath }}"
              data-label="{{ e.text }}"
              :disabled="loading"
              @click="goInto($el.dataset.filepath, $el.dataset.label)">
              &#128193; {{ e.text }}
            </button>
            {% else %}
            &#128196; {{ e.text }}
            {% endif %}
          </td>
          <td>{{ e.size | filesizeformat if e.size is not none else '' }}</td>
          <td>{{ e.type_label }}</td>
          <td>{{ e.mtime | fromtimestamp if e.mtime is not none else '' }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</form>
