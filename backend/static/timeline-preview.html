<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Proxmox File Level Restore Portal &mdash; Timeline preview (synthetic data)</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="app.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Dev-only test harness: generates fake snapshots so the timeline widget
    // (clustering, day-picker, older/newer nav) can be exercised without real
    // backup history. Browsing into a snapshot will hit the real backend with
    // a fake volume string and show the normal "not browsable" error - that's
    // expected here, this page only exists to test the timeline itself.
    // NOTE: keep the markup below (topbar, breadcrumb-bar, tree-pane,
    // <footer class="timeline-panel">) in sync with
    // backend/templates/index.html if that markup changes.
    function syntheticSnapshots() {
      const out = [];
      const base = new Date();
      base.setHours(2, 0, 0, 0);
      for (let daysAgo = 90; daysAgo >= 0; daysAgo--) {
        const day = new Date(base);
        day.setDate(day.getDate() - daysAgo);
        // Most days: one nightly backup. Every 6th day: a few extra same-day
        // snapshots (simulating manual/hourly runs) to exercise clustering.
        const hours = daysAgo % 6 === 0 ? [2, 8, 14, 20] : [2];
        for (const hour of hours) {
          const t = new Date(day);
          t.setHours(hour, 0, Math.floor(Math.random() * 60), 0);
          const iso = t.toISOString().slice(0, 19) + 'Z';
          out.push({
            volume: `pbs:backup/vm/133/${iso}`,
            time: iso,
            size: 15000000000 + Math.floor(Math.random() * 5000000000),
            verified: Math.random() > 0.1,
          });
        }
      }
      return out;
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <img class="topbar-icon" src="assets/logo.png" alt="">
      <h1>Proxmox File Level Restore Portal</h1>
    </div>
    <div class="topbar-meta">
      <div class="task-trigger" style="cursor: default;">
        <span class="task-trigger-text">
          <span class="status-title">Preview</span>
          <span class="status-value">Synthetic data</span>
        </span>
      </div>
      <div x-data="userMenu('preview@pve')">
        <button type="button" class="user-menu-trigger" @click.stop="open = !open">
          <svg class="user-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </button>
        <div class="user-dropdown" x-show="open" x-cloak @click.outside="open = false">
          <div class="user-dropdown-header">
            <svg class="user-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span x-text="identity"></span>
          </div>
          <button type="button" class="user-dropdown-item" @click="open = false; aboutOpen = true">About</button>
          <button type="button" class="user-dropdown-item" @click="logout()">Logout</button>
        </div>
        <div class="modal-overlay" x-show="aboutOpen" x-cloak @click.self="aboutOpen = false" @keydown.escape.window="aboutOpen = false">
          <div class="modal-box about-box">
            <button type="button" class="modal-close about-close" @click="aboutOpen = false">&times;</button>
            <img class="about-logo" src="assets/logo.png" alt="">
            <h2 class="about-title">Proxmox File Level Restore Portal</h2>
            <p class="about-credit">Vibe coded by Trey Jones and Claude.</p>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="page" x-data="portalApp(syntheticSnapshots())" x-init="init()">
    <section class="browser">
      <div id="loading" class="htmx-indicator">Loading&hellip;</div>
      <div class="breadcrumb-bar" x-show="volume" x-cloak>
        <div class="history-nav">
          <button type="button" class="nav-btn" @click="goBack()" :disabled="!canGoBack || loading" title="Back">&lsaquo;</button>
          <button type="button" class="nav-btn" @click="goForward()" :disabled="!canGoForward || loading" title="Forward">&rsaquo;</button>
        </div>
        <nav class="breadcrumb">
          <template x-for="(crumb, idx) in crumbs" :key="idx">
            <span>
              <button type="button" class="crumb-btn" @click="goTo(idx)" :disabled="loading" x-text="crumb.label"></button>
              <span class="crumb-sep" x-show="idx < crumbs.length - 1">&rsaquo;</span>
            </span>
          </template>
        </nav>
        <div class="grid-filter">
          <svg class="grid-filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <input type="text" x-model="fileFilter" placeholder="Filter" class="grid-filter-input">
        </div>
      </div>
      <div class="browser-body">
        <nav class="tree-pane" x-show="volume" x-cloak :style="'flex-basis: ' + treeWidth + 'px'">
          <div id="tree-root"></div>
        </nav>
        <div class="tree-resizer" x-show="volume" x-cloak @pointerdown="startTreeResize($event)"></div>
        <div class="browse-main">
          <div id="file-grid">
            <p class="empty-state">Synthetic volumes aren't real backups &mdash; expect the "not browsable" error here. This page is only for testing the timeline widget below.</p>
          </div>
        </div>
      </div>
    </section>

    <footer class="timeline-panel" x-show="snapshots.length" x-cloak>
      <div class="timeline-toolbar">
        <button type="button" class="icon-btn" @click="openDatePicker()" title="Jump to date">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <input type="date" x-ref="datePicker" @change="jumpToDate($event.target.value)" class="sr-only-date-input" tabindex="-1">
        <button type="button" class="icon-btn" @click="jumpToNow()" title="Now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/></svg>
        </button>
        <button type="button" class="icon-btn" @click="resetView()" title="Jump to latest snapshot">
          <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn" @click="refreshSnapshots()" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10M1 14l5.36 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button type="button" class="icon-btn" @click="olderSnapshot()" :disabled="!hasOlder" title="Older version">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button type="button" class="icon-btn" @click="newerSnapshot()" :disabled="!hasNewer" title="Newer version">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="timeline-zoom-controls">
        <button type="button" class="icon-btn zoom-btn zoom-btn--top" @click="zoom(0.5)" title="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button type="button" class="icon-btn zoom-btn zoom-btn--bottom" @click="zoom(2)" title="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>
      <div class="timeline-track" x-ref="timelineTrack">
        <svg x-ref="timelineSvg" class="timeline-svg" viewBox="0 0 1000 90" preserveAspectRatio="none"></svg>
        <div
          class="timeline-daypicker"
          x-show="activeDayKey"
          x-cloak
          :style="'left:' + activeDayX + 'px'"
          @click.outside="activeDayKey = null">
          <div class="timeline-daypicker-title" x-text="activeDayKey"></div>
          <ul>
            <template x-for="(s, idx) in activeDayItems" :key="s.volume">
              <li>
                <button
                  type="button"
                  :class="{ 'is-selected': s.volume === selectedVolume }"
                  @click="selectSnapshot(s)">
                  <span class="timeline-daypicker-index" x-text="idx + 1"></span>
                  <span x-text="s.time"></span>
                </button>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
