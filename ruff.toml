# Lint config for the backend + test suite. Kept lean for a single-admin
# homelab tool: pyflakes + pycodestyle + import sorting + pyupgrade, minus
# the opinionated plugins that would flag idiomatic FastAPI (Depends() in
# defaults) or deliberate broad excepts.
line-length = 120
# py311, not the dev machine's 3.14: Debian 12 (bookworm), the deploy
# target in deploy/, ships Python 3.11 by default. Keeps pyupgrade (UP)
# from suggesting syntax that would break the LXC/Docker install.
target-version = "py311"

[lint]
select = ["E", "F", "I", "W", "UP", "RUF"]

[lint.per-file-ignores]
# conftest.py sets required env vars, and a few test modules call
# pytest.importorskip, before importing anything from `backend`.
"tests/*" = ["E402"]
