name: CI

# The general correctness gate, independent of releases - runs on every
# push and PR. docs/dev/versioning.md documents why this exists and how
# it relates to release.yml (which re-runs the same suite as a release
# gate).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install npm dependencies (CSS suite)
        run: npm install

      - name: Run the full test suite
        run: ./run-tests.sh
